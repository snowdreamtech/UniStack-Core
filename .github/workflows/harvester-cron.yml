name: Harvester Cron

on:
  schedule:
    - cron: '0 2 * * *' # Run daily at 02:00 UTC
  workflow_dispatch:      # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest-and-pr:
    name: Harvest & Create PR
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      pr_number: ${{ steps.cpr.outputs.pull-request-number }}
      branch_name: ${{ steps.cpr.outputs.pull-request-branch-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'

      - name: Run Harvester
        working-directory: scripts/harvester
        run: |
          go mod tidy
          go run .

      - name: Create Pull Request
        id: cpr
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Skipping PR creation."
            echo "pull-request-number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git checkout -b harvester-auto-update
          git add .
          git commit -m "chore(harvester): auto-update core packages from Repology"
          git push --force origin harvester-auto-update
          
          PR_EXISTS=$(gh pr list --head harvester-auto-update --json number --jq 'length')
          if [ "$PR_EXISTS" -eq "0" ]; then
            PR_URL=$(gh pr create \
              --title "chore(harvester): Auto-update UniStack Core Packages" \
              --body "Automated PR to update UniStack core packages mapped from the latest Repology daily database dump.

          **Harvester Action**: 
          - Extracted \`packages\` table from Repology.
          - Mapped matching projects across Debian, RHEL, and Alpine.
          - AST-merged output into \`packages/*/package.yml\`." \
              --head harvester-auto-update \
              --base main)
            PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          else
            PR_NUMBER=$(gh pr list --head harvester-auto-update --json number --jq '.[0].number')
          fi
          
          echo "pull-request-number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pull-request-branch-name=harvester-auto-update" >> $GITHUB_OUTPUT

  validate-pr:
    name: Validate Packages (CI)
    needs: harvest-and-pr
    if: ${{ needs.harvest-and-pr.outputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.harvest-and-pr.outputs.branch_name }}

      - name: Install UniStack CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/snowdreamtech/unistack/main/install.sh | bash
          echo "$HOME/.unistack/bin" >> $GITHUB_PATH

      - name: Validate Changed Packages
        run: |
          # Fetch changed files
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep '^packages/.*package.yml$' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No package.yml files changed."
            exit 0
          fi
          
          echo "Validating changed packages:"
          echo "$CHANGED_FILES"
          
          for file in $CHANGED_FILES; do
            pkg_dir=$(dirname "$file")
            echo "Validating: $pkg_dir"
            # Mock sandbox validation using unistack (simulating install validation)
            # In actual implementation, we might tar it or unistack supports local parsing natively
            tar -czvf /tmp/pkg.tar.gz -C "$pkg_dir" package.yml
            unistack install /tmp/pkg.tar.gz --dry-run
          done

  auto-merge:
    name: Auto Merge
    needs: [harvest-and-pr, validate-pr]
    if: ${{ needs.harvest-and-pr.outputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ needs.harvest-and-pr.outputs.pr_number }} --auto --squash --delete-branch --repo ${{ github.repository }}
